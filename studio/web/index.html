      <button type="button" class="pb-btn pb-q pb-sm" id="pb-shuffle" title="随机播放" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button><button type="button" class="pb-btn pb-q" data-pb="prev" title="上一首" hidden><svg viewBox="0 0 24 24" fill="currentColor"><g transform="matrix(-1 0 0 1 24 0)"><path d="M2.6 6.4c0-1 1.1-1.6 1.9-1L12 10.9V6.4c0-1 1.1-1.6 1.9-1l7.5 5.6c.7.5.7 1.5 0 2l-7.5 5.6c-.8.6-1.9 0-1.9-1v-4.5l-7.5 5.5c-.8.6-1.9 0-1.9-1z"/></g></svg></button>
      <button type="button" class="pb-btn" data-pb="back" title="后退 10 秒"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7L4 8.6"/><path d="M4 4v4.6h4.6"/><text x="12" y="15.6" text-anchor="middle" font-size="7.4" font-weight="700" fill="currentColor" stroke="none" font-family="system-ui">10</text></svg></button>
      <button type="button" class="pb-btn pb-play" data-pb="play" title="播放 / 暂停"></button>
      <button type="button" class="pb-btn" data-pb="fwd" title="前进 10 秒"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.4-5.7L20 8.6"/><path d="M20 4v4.6h-4.6"/><text x="12" y="15.6" text-anchor="middle" font-size="7.4" font-weight="700" fill="currentColor" stroke="none" font-family="system-ui">10</text></svg></button>
      <button type="button" class="pb-btn pb-q" data-pb="next" title="下一首" hidden><svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.6 6.4c0-1 1.1-1.6 1.9-1L12 10.9V6.4c0-1 1.1-1.6 1.9-1l7.5 5.6c.7.5.7 1.5 0 2l-7.5 5.6c-.8.6-1.9 0-1.9-1v-4.5l-7.5 5.5c-.8.6-1.9 0-1.9-1z"/></svg></button><button type="button" class="pb-btn pb-q pb-sm" id="pb-repeat" title="循环" hidden></button>

    <button type="button" class="pb-btn pb-more" id="pb-more" title="更多" aria-label="更多"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5.5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="18.5" cy="12" r="1.9"/></svg></button>

  <div class="pb-right">

    <button type="button" class="pb-icon" id="pb-video" title="显示 / 收起画面" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.2-2.5z" fill="currentColor" stroke="none"/></svg></button><button type="button" class="pb-icon" id="pb-fx" title="音效与声道"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg></button><button type="button" class="pb-icon" id="pb-queue" title="播放列表"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 6h11M4 12h11M4 18h7"/><path d="M18 14v6M15 17h6" /></svg></button>
    <div class="vol-ctl" id="vol-ctl"><button id="vol-btn" type="button" title="音量（也可用滚轮调节）" aria-label="音量"></button>

<!-- 收起播放条后：右下角一个小圆按钮（正在放的时候转圈），点一下展开 -->
<button type="button" class="pb-fab" id="pb-fab" title="展开播放条" aria-label="展开播放条" hidden><span class="pb-fab-art" id="pb-fab-art"></span><span class="pb-fab-ring"></span></button>
<!-- 播放列表面板（从底栏右侧弹出） -->
<div class="qpanel" id="qpanel" hidden></div>

<div class="qpanel spanel" id="spanel" hidden></div>
<!-- 正在播放：全屏播放页（参考 Apple Music 的全屏播放 / 歌词页） -->
<div class="np" id="np" hidden>
  <div class="np-bg" id="np-bg"></div><div class="np-thin"><div id="np-thin"></div></div>
  <div class="np-top">
    <button type="button" class="np-x" id="np-close" title="收起（Esc）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
    <div class="seg np-tabs"><button data-np="subs" class="on">字幕</button><button data-np="queue">播放列表</button></div>
    <div class="np-tools"><button type="button" class="np-x" id="np-mini" title="迷你播放器" aria-label="迷你播放器" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/><rect x="13" y="4" width="7" height="6" rx="1.2"/></svg></button><button type="button" class="np-x vid-only hide-btn" id="np-hide" title="立即隐藏控制条（移动鼠标即可恢复）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 6.1A9.9 9.9 0 0 1 12 6c5 0 9 6 9 6a17 17 0 0 1-3.1 3.6M6.6 6.6C4.1 8.3 3 12 3 12s4 6 9 6a9.5 9.5 0 0 0 4.4-1.1M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button><button type="button" class="np-x vid-only" id="np-capbtn" title="画面字幕（生成字幕后显示在视频上）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10.5 10.3a2 2 0 1 0 0 3.4M17 10.3a2 2 0 1 0 0 3.4"/></svg></button><button type="button" class="np-x vid-only" id="np-pip" title="画中画（缩小为页面内的小窗，可边看边操作）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><rect x="12" y="11" width="7" height="6" rx="1.5" fill="currentColor" stroke="none"/></svg></button><button type="button" class="np-x vid-only" id="np-theater" title="隐藏侧边栏（视频铺满）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M15 5v14"/></svg></button><button type="button" class="np-x aud-more" id="np-more2" title="更多（外观、音效、字幕）" aria-label="更多"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5.5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="18.5" cy="12" r="1.8"/></svg></button><button type="button" class="np-x" id="np-fx" title="音效与声道"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg></button><button type="button" class="np-x" id="np-fs" title="全屏（F）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button></div>
  </div>
  <!-- 电脑（2026-11-18 方案 Y）：右上角一组 = 侧栏开关（视频）· 迷你播放器 · 全屏（音频）│ 窗口按钮；视频右下角 = 音量 · 画面字幕 · 全屏 · ⋯（npYPlace 把按钮挪进来） -->
  <div class="np-wg" id="np-wg"></div>
  <div class="np-body">
    <div class="np-left">
      <div class="np-stage" id="np-stage"><div class="np-art" id="np-art"></div><div class="np-cap" id="np-cap" hidden></div><button type="button" class="vid-corner-fs" id="np-fs2" title="全屏（F）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button></div>
      <div class="np-meta"><div style="min-width:0;flex:1"><div class="np-title" id="np-title"></div><div class="np-sub" id="np-sub"></div></div><button type="button" class="fav-btn np-fav" id="np-fav" title="收藏" hidden></button><button type="button" class="np-more" id="np-more" title="更多" aria-label="更多"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5.5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="18.5" cy="12" r="1.9"/></svg></button></div>
      <div class="np-prog"><div class="np-track" id="np-track"><div class="np-fill" id="np-fill"></div></div><div class="np-times"><span id="np-t0">0:00</span><span id="np-t1">0:00</span></div></div>
      <div class="np-ctl">
        <button type="button" class="np-b sm" id="np-shuffle" title="随机播放"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
        <button type="button" class="np-b" data-npb="prev" title="上一首"><svg viewBox="0 0 24 24" fill="currentColor"><g transform="matrix(-1 0 0 1 24 0)"><path d="M2.6 6.4c0-1 1.1-1.6 1.9-1L12 10.9V6.4c0-1 1.1-1.6 1.9-1l7.5 5.6c.7.5.7 1.5 0 2l-7.5 5.6c-.8.6-1.9 0-1.9-1v-4.5l-7.5 5.5c-.8.6-1.9 0-1.9-1z"/></g></svg></button>
        <button type="button" class="np-b" data-npb="back" title="后退 10 秒"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7L4 8.6"/><path d="M4 4v4.6h4.6"/><text x="12" y="15.6" text-anchor="middle" font-size="7.4" font-weight="700" fill="currentColor" stroke="none" font-family="system-ui">10</text></svg></button>
        <button type="button" class="np-b play" data-npb="play" title="播放 / 暂停"></button>
        <button type="button" class="np-b" data-npb="fwd" title="前进 10 秒"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.4-5.7L20 8.6"/><path d="M20 4v4.6h-4.6"/><text x="12" y="15.6" text-anchor="middle" font-size="7.4" font-weight="700" fill="currentColor" stroke="none" font-family="system-ui">10</text></svg></button>
        <button type="button" class="np-b" data-npb="next" title="下一首"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.6 6.4c0-1 1.1-1.6 1.9-1L12 10.9V6.4c0-1 1.1-1.6 1.9-1l7.5 5.6c.7.5.7 1.5 0 2l-7.5 5.6c-.8.6-1.9 0-1.9-1v-4.5l-7.5 5.5c-.8.6-1.9 0-1.9-1z"/></svg></button>
        <button type="button" class="np-b sm" id="np-repeat" title="循环"></button>
        <!-- 音量（照 Apple Music 网页版：控制按钮下面一条，只有左边一个喇叭，声波随音量变，点它静音；视频放在按钮这一排的右边） -->
        <div class="np-vol" id="np-vol"><button type="button" class="np-vb" id="np-vmute" title="静音" aria-label="静音"></button><div class="np-vtrack" id="np-vtrack" role="slider" tabindex="0" aria-label="音量" aria-valuemin="0" aria-valuemax="100"><div class="np-vfill" id="np-vfill"></div><b class="np-vknob" id="np-vknob"></b></div></div>
      </div>
      <div class="np-vr" id="np-vr"></div>
    </div>
    <div class="np-right" id="np-right"></div>
    <button type="button" class="np-x np-min" id="np-min" title="退出全屏播放（Esc）" aria-label="退出全屏播放"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4.5v5h5M9.5 19.5v-5h-5"/></svg></button>
    <!-- 手机：底部一排（参照 Apple Music）——字幕、音效与声道、播放列表；点字幕 / 播放列表时封面和标题缩到左上角，中间给字幕 / 列表 -->
    <div class="np-dock" id="np-dock">
      <button type="button" class="np-b sm" data-mv="subs" title="字幕" aria-label="字幕"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 15.5a2.5 2.5 0 0 1-2.5 2.5H9l-5 3.5V6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5z"/><path d="M8.5 9.5h7M8.5 13h4.5"/></svg></button>
      <button type="button" class="np-b sm" id="np-fxm" title="音效与声道" aria-label="音效与声道"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg></button>
      <button type="button" class="np-b sm" data-mv="queue" title="播放列表" aria-label="播放列表"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.1" fill="currentColor"/><circle cx="4.5" cy="12" r="1.1" fill="currentColor"/><circle cx="4.5" cy="18" r="1.1" fill="currentColor"/></svg></button>
    </div>
  </div>
</div>
<div class="dock-zone" id="dock-zone"><span>松开即可放回播放条</span></div>
